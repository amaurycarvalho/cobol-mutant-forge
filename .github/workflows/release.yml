name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: make build

      - name: Publish self-contained binaries
        run: make publish

      - name: Package release archives
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p "$RELEASE_DIR/archives"
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
            if [ "$rid" = "win-x64" ]; then
              (cd "$RELEASE_DIR" && zip -r "archives/cobol-mutant-forge-$VERSION-$rid.zip" "$rid")
            else
              tar -czf "$RELEASE_DIR/archives/cobol-mutant-forge-$VERSION-$rid.tar.gz" -C "$RELEASE_DIR" "$rid"
            fi
          done
        env:
          RELEASE_DIR: artifacts/release

      - name: Create GitHub release with archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "CobolMutantForge ${{ github.ref_name }}"
          files: |
            artifacts/release/archives/*
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
